<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>

/* =========================================================
   KONFIGURASI
   ========================================================= */

const CSV_URL =
    "https://raw.githubusercontent.com/duniandis/data_apk/main/stock_external.csv";


/* =========================================================
   DATA GLOBAL
   ========================================================= */

let stockData = [];
let diameterClasses = [];
let positions = [];


/* =========================================================
   BACA CSV
   Parser dibuat agar aman untuk angka seperti:
   "1,598.54"
   ========================================================= */

function parseCSV(text) {

    const rows = [];
    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {

            if (insideQuotes && next === '"') {
                cell += '"';
                i++;
            } else {
                insideQuotes = !insideQuotes;
            }

        } else if (char === "," && !insideQuotes) {

            row.push(cell);
            cell = "";

        } else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(cell);

            if (row.some(v => v.trim() !== "")) {
                rows.push(row);
            }

            row = [];
            cell = "";

        } else {

            cell += char;
        }
    }

    row.push(cell);

    if (row.some(v => v.trim() !== "")) {
        rows.push(row);
    }

    if (!rows.length) {
        return [];
    }

    const headers = rows[0].map(h =>
        h.trim()
         .replace(/^\uFEFF/, "")
         .toLowerCase()
    );

    return rows.slice(1).map(r => {

        const obj = {};

        headers.forEach((header, index) => {
            obj[header] = (r[index] ?? "").trim();
        });

        return obj;

    });
}


/* =========================================================
   KONVERSI ANGKA
   ========================================================= */

function toNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return 0;
    }

    let text = String(value)
        .trim()
        .replace(/\s/g, "");

    /*
       Format CSV diasumsikan angka standar:
       1598.54
       atau
       1,598.54
    */

    text = text.replace(/,/g, "");

    const number = Number(text);

    return isNaN(number) ? 0 : number;
}


/* =========================================================
   FORMAT ANGKA
   ========================================================= */

function formatBtg(value) {

    const n = toNumber(value);

    if (n === 0) {
        return "-";
    }

    return n.toLocaleString("en-US", {
        maximumFractionDigits: 0
    });
}


function formatVolume(value) {

    const n = toNumber(value);

    if (n === 0) {
        return "-";
    }

    return n.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


/* =========================================================
   NORMALISASI TANGGAL
   ========================================================= */

function parseDateValue(value) {

    if (!value) {
        return null;
    }

    const v = String(value).trim();

    /*
       YYYY-MM-DD
    */

    let m = v.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
    );

    if (m) {

        return new Date(
            Number(m[1]),
            Number(m[2]) - 1,
            Number(m[3])
        );
    }


    /*
       DD-MM-YYYY
       DD/MM/YYYY
    */

    m = v.match(
        /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/
    );

    if (m) {

        return new Date(
            Number(m[3]),
            Number(m[2]) - 1,
            Number(m[1])
        );
    }


    const d = new Date(v);

    if (!isNaN(d)) {
        return d;
    }

    return null;
}


function formatDate(value) {

    if (!value) {
        return "-";
    }

    const date = parseDateValue(value);

    if (!date) {
        return value;
    }

    return date.toLocaleDateString(
        "id-ID",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );
}


/* =========================================================
   CARI TANGGAL TERBARU
   ========================================================= */

function latestDate(values) {

    let latest = null;
    let original = "";

    values.forEach(value => {

        const d = parseDateValue(value);

        if (d && (!latest || d > latest)) {

            latest = d;
            original = value;
        }

    });

    return original;
}


/* =========================================================
   AMBIL NILAI UNIK
   ========================================================= */

function uniqueValues(data, field) {

    return [
        ...new Set(
            data
                .map(x => x[field])
                .filter(Boolean)
        )
    ];
}


/* =========================================================
   URUT KELAS DIAMETER
   Dibuat fleksibel.
   ========================================================= */

function diameterSort(a, b) {

    const na = parseInt(
        String(a).match(/\d+/)?.[0] || "999999"
    );

    const nb = parseInt(
        String(b).match(/\d+/)?.[0] || "999999"
    );

    return na - nb;
}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadStock() {

    const status =
        document.getElementById("status");

    try {

        /*
           Tambahkan timestamp agar browser tidak
           menggunakan cache CSV lama.
        */

        const response = await fetch(
            CSV_URL + "?t=" + Date.now()
        );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }

        const text = await response.text();

        stockData = parseCSV(text);


        /* ===============================================
           CEK KOLOM WAJIB
           =============================================== */

        if (!stockData.length) {

            throw new Error(
                "stock.csv kosong."
            );
        }


        /* ===============================================
           HAPUS BARIS TANPA POSISI / JENIS
           =============================================== */

        stockData = stockData.filter(row => {

            return (
                row.posisi &&
                row.jenis
            );

        });


        /* ===============================================
           KELAS DIAMETER DINAMIS
           =============================================== */

        diameterClasses =
            uniqueValues(
                stockData,
                "kelas_diameter"
            )
            .sort(diameterSort);


        /* ===============================================
           POSISI DINAMIS
           HANYA YANG ADA DI CSV
           =============================================== */

        positions =
            uniqueValues(
                stockData,
                "posisi"
            );


        /* ===============================================
           TANGGAL MUTASI GLOBAL
           =============================================== */

        const globalDate =
            latestDate(
                stockData.map(
                    x =>
                    x.mutasi_terakhir_global
                )
            );

        document.getElementById(
            "globalDate"
        ).textContent =
            formatDate(globalDate);


        createPositionFilter();

        status.style.display = "none";

        render();

    } catch (error) {

        console.error(error);

        status.innerHTML =
            '<span class="error">' +
            "Gagal membaca stock.csv.<br>" +
            error.message +
            "</span>";
    }
}


/* =========================================================
   FILTER POSISI
   ========================================================= */

function createPositionFilter() {

    const select =
        document.getElementById(
            "positionFilter"
        );

    select.innerHTML =
        '<option value="">Semua Posisi</option>';

    positions.forEach(position => {

        const option =
            document.createElement(
                "option"
            );

        option.value = position;
        option.textContent = position;

        select.appendChild(option);
    });
}


/* =========================================================
   AMBIL JENIS DALAM POSISI
   ========================================================= */

function getSpecies(data) {

    return [
        ...new Set(
            data
                .map(x => x.jenis)
                .filter(Boolean)
        )
    ];
}


/* =========================================================
   HITUNG DATA
   ========================================================= */

function calculate(
    data,
    jenis,
    diameter
) {

    const rows = data.filter(row => {

        return (
            row.jenis === jenis &&
            row.kelas_diameter === diameter
        );

    });

    return rows.reduce(
        (result, row) => {

            result.btg +=
                toNumber(row.btg);

            result.volume +=
                toNumber(row.volume_m3);

            return result;

        },
        {
            btg: 0,
            volume: 0
        }
    );
}


/* =========================================================
   TOTAL JENIS
   ========================================================= */

function calculateSpeciesTotal(
    data,
    jenis
) {

    return data
        .filter(
            row =>
            row.jenis === jenis
        )
        .reduce(
            (result, row) => {

                result.btg +=
                    toNumber(row.btg);

                result.volume +=
                    toNumber(
                        row.volume_m3
                    );

                return result;

            },
            {
                btg: 0,
                volume: 0
            }
        );
}


/* =========================================================
   TOTAL SEMUA BARIS
   ========================================================= */

function calculateTotal(data) {

    return data.reduce(
        (result, row) => {

            result.btg +=
                toNumber(row.btg);

            result.volume +=
                toNumber(
                    row.volume_m3
                );

            return result;

        },
        {
            btg: 0,
            volume: 0
        }
    );
}


/* =========================================================
   TANGGAL MUTASI POSISI
   ========================================================= */

function positionMutationDate(data) {

    return latestDate(
        data.map(
            row =>
            row.mutasi_terakhir_posisi
        )
    );
}


/* =========================================================
   BUAT TABEL
   ========================================================= */

function buildTable(
    data,
    title,
    isGrandTotal = false
) {

    const species =
        getSpecies(data);

    const mutationDate =
        positionMutationDate(data);


    let html = `
    <div class="
        stock-section
        ${isGrandTotal
            ? "grand-total-section"
            : ""}
    ">

        <div class="section-title">

            <span>${escapeHTML(title)}</span>

            ${
                !isGrandTotal
                ? `
                <span class="section-date">
                    Mutasi Terakhir:
                    <b>
                    ${escapeHTML(
                        formatDate(
                            mutationDate
                        )
                    )}
                    </b>
                </span>
                `
                : ""
            }

        </div>

        <div class="table-scroll">

        <table>

            <thead>

                <tr>

                    <th rowspan="2">
                        NO
                    </th>

                    <th rowspan="2">
                        JENIS KAYU
                    </th>
    `;


    /* ===============================================
       HEADER KELAS DIAMETER DINAMIS
       =============================================== */

    diameterClasses.forEach(diameter => {

        html += `
            <th colspan="2">
                ${escapeHTML(diameter)}
            </th>
        `;

    });


    html += `

        <th colspan="2">
            JUMLAH
        </th>

    </tr>

    <tr>
    `;


    diameterClasses.forEach(() => {

        html += `
            <th>BTG</th>
            <th>VOL (M³)</th>
        `;

    });


    html += `
        <th>BTG</th>
        <th>VOL (M³)</th>
    </tr>

    </thead>

    <tbody>
    `;


    /* ===============================================
       BARIS JENIS KAYU
       =============================================== */

    species.forEach(
        (jenis, index) => {

            html += `
            <tr>

                <td class="center">
                    ${index + 1}
                </td>

                <td class="jenis">
                    ${escapeHTML(jenis)}
                </td>
            `;


            diameterClasses.forEach(
                diameter => {

                    const value =
                        calculate(
                            data,
                            jenis,
                            diameter
                        );

                    html += `
                        <td class="number">
                            ${formatBtg(
                                value.btg
                            )}
                        </td>

                        <td class="number">
                            ${formatVolume(
                                value.volume
                            )}
                        </td>
                    `;

                }
            );


            const speciesTotal =
                calculateSpeciesTotal(
                    data,
                    jenis
                );


            html += `

                <td class="number">
                    ${formatBtg(
                        speciesTotal.btg
                    )}
                </td>

                <td class="number">
                    ${formatVolume(
                        speciesTotal.volume
                    )}
                </td>

            </tr>
            `;

        }
    );


    /* ===============================================
       TOTAL PER POSISI
       =============================================== */

    html += `
        <tr class="total-row">

            <td></td>

            <td class="center">
                TOTAL
            </td>
    `;


    diameterClasses.forEach(
        diameter => {

            const diameterRows =
                data.filter(
                    row =>
                    row.kelas_diameter ===
                    diameter
                );

            const total =
                calculateTotal(
                    diameterRows
                );


            html += `

                <td class="number">
                    ${formatBtg(
                        total.btg
                    )}
                </td>

                <td class="number">
                    ${formatVolume(
                        total.volume
                    )}
                </td>
            `;

        }
    );


    const total =
        calculateTotal(data);


    html += `

        <td class="number">
            ${formatBtg(total.btg)}
        </td>

        <td class="number">
            ${formatVolume(
                total.volume
            )}
        </td>

    </tr>

    </tbody>

    </table>

    </div>

    </div>
    `;


    return html;
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const selectedPosition =
        document
        .getElementById(
            "positionFilter"
        )
        .value;


    let filtered = stockData;


    /* ===============================================
       FILTER POSISI
       =============================================== */

    if (selectedPosition) {

        filtered =
            filtered.filter(
                row =>
                row.posisi ===
                selectedPosition
            );
    }


    /* ===============================================
       FILTER JENIS
       =============================================== */

    if (search) {
        // Beberapa jenis dapat dicari sekaligus, dipisahkan koma.
        // Contoh: Keruing,Benuas menampilkan keduanya (logika OR).
        const keywords = search.split(',').map(s => s.trim()).filter(Boolean);
        if (keywords.length) {
            filtered = filtered.filter(row => {
                const jenis = String(row.jenis ?? '').toLowerCase();
                return keywords.some(keyword => jenis.includes(keyword));
            });
        }
    }


    const content =
        document.getElementById(
            "content"
        );


    if (!filtered.length) {

        content.innerHTML =
            `
            <div class="no-data">
                Data tidak ditemukan.
            </div>
            `;

        return;
    }


    let html = "";


    /* ===============================================
       TABEL PER POSISI

       POSISI DIAMBIL LANGSUNG DARI CSV.
       TIDAK ADA DAFTAR POSISI MANUAL.
       =============================================== */

    const activePositions =
        [
            ...new Set(
                filtered.map(
                    row => row.posisi
                )
            )
        ];


    activePositions.forEach(
        (position, index) => {

            const positionData =
                filtered.filter(
                    row =>
                    row.posisi ===
                    position
                );


            /*
             * Hanya tampil jika benar-benar
             * mempunyai BTG / volume.
             */

            const hasStock =
                positionData.some(
                    row =>
                    toNumber(row.btg) !== 0 ||
                    toNumber(
                        row.volume_m3
                    ) !== 0
                );


            if (!hasStock) {
                return;
            }


            const letter =
                String.fromCharCode(
                    65 + index
                );


            html += buildTable(
                positionData,
                letter + ". " + position
            );

        }
    );


    /* ===============================================
       STOCK KESELURUHAN
       SELALU PALING BAWAH

       Ini merupakan penjumlahan seluruh posisi
       yang sedang ditampilkan.
       =============================================== */

    html += buildTable(
        filtered,
        "STOCK KESELURUHAN",
        true
    );


    content.innerHTML = html;
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   RESET
   ========================================================= */

function resetFilter() {

    document.getElementById(
        "searchInput"
    ).value = "";

    document.getElementById(
        "positionFilter"
    ).value = "";

    render();
}


 /* =========================================================
    DOWNLOAD PDF - DATA SESUAI TAMPILAN/FILTER
    ========================================================= */
 async function downloadStockPDF() {
     const button = document.getElementById('downloadPdf');
     if (!stockData.length) { alert('Data stock belum tersedia.'); return; }
     if (!window.jspdf || !window.jspdf.jsPDF) {
         alert('Pustaka PDF belum termuat. Periksa koneksi internet lalu coba lagi.');
         return;
     }
     const now = new Date();
     const pad = n => String(n).padStart(2, '0');
     const timestamp = now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate())
         + '_' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
     const filename = 'Stock_' + timestamp + '.pdf';
     button.disabled = true;
     button.textContent = 'Membuat PDF...';
     try {
         const { jsPDF } = window.jspdf;
         const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
         if (typeof pdf.autoTable !== 'function') throw Error('Pustaka tabel PDF belum termuat.');
         const pageWidth = pdf.internal.pageSize.getWidth();
         const pageHeight = pdf.internal.pageSize.getHeight();
         const margin = 12;
         let y = 17;
         pdf.setFont('helvetica','bold');
         pdf.setFontSize(15);
         pdf.text('POSISI STOCK KAYU BULAT WIKI', margin, y);
         y += 7;
         pdf.setFont('helvetica','normal');
         pdf.setFontSize(9);
         pdf.text('Tanggal Mutasi Terakhir Global: ' + document.getElementById('globalDate').textContent, margin, y);
         y += 5;
         pdf.text('Diunduh: ' + now.toLocaleString('id-ID') + ' | Sumber: nds.db', margin, y);
         y += 9;
         const sections = [...document.querySelectorAll('#content .stock-section')];
         if (!sections.length) throw Error('Tidak ada tabel stock untuk disimpan.');
         for (const section of sections) {
             const title = section.querySelector('.section-title')?.innerText.replace(/\s+/g,' ').trim() || 'STOCK';
             const table = section.querySelector('table');
             if (!table) continue;
             const headRows = [...table.querySelectorAll('thead tr')];
             const bodyRows = [...table.querySelectorAll('tbody tr')];
             // AutoTable membaca rowspan/colspan dari elemen HTML secara otomatis.
             if (y > pageHeight - 35) { pdf.addPage(); y = 17; }
             pdf.setFont('helvetica','bold');
             pdf.setFontSize(10);
             pdf.text(title, margin, y);
             y += 3;
             pdf.autoTable({
                 html: table,
                 startY: y,
                 margin: { left:margin, right:margin, top:16, bottom:15 },
                 theme: 'grid',
                 styles: { font:'helvetica', fontSize:7, cellPadding:1.6, overflow:'linebreak', halign:'center', lineWidth:0.12, lineColor:[110,110,110] },
                 headStyles: { fillColor:[233,221,244], textColor:[30,30,30], fontStyle:'bold' },
                 alternateRowStyles: { fillColor:[250,248,252] },
                 columnStyles: { 1: { halign:'left' } },
                 tableWidth:'auto',
                 showHead:'everyPage',
                 didParseCell: data => {
                     if (data.section === 'body' && data.row.raw?.classList?.contains('total-row')) {
                         data.cell.styles.fillColor = [233,221,244];
                         data.cell.styles.fontStyle = 'bold';
                     }
                 }
             });
             y = pdf.lastAutoTable.finalY + 12;
         }
         const pages = pdf.internal.getNumberOfPages();
         for (let i=1; i<=pages; i++) {
             pdf.setPage(i);
             pdf.setFontSize(8);
             pdf.setFont('helvetica','normal');
             pdf.text('Halaman ' + i + ' / ' + pages, pageWidth-margin, pageHeight-7, {align:'right'});
         }
         pdf.save(filename);
     } catch (err) {
         console.error(err);
         alert('Gagal membuat PDF: ' + err.message);
     } finally {
         button.disabled = false;
         button.textContent = 'Download PDF';
     }
 }

    render

    render

loadStock();
